name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore IgFoodBot.slnx

      - name: Build
        run: dotnet build IgFoodBot.slnx --no-restore --configuration Release

      - name: Test
        run: dotnet test IgFoodBot.slnx --no-build --configuration Release --logger "console;verbosity=normal"
